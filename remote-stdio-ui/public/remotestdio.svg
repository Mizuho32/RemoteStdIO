<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9fd5ff"/>
      <stop offset="100%" stop-color="#8cbcff"/>
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)" />

  <!-- clouds -->
  <g fill="#fff">
    <circle cx="150" cy="360" r="60"/>
    <circle cx="230" cy="380" r="70"/>
    <circle cx="310" cy="360" r="60"/>
    <circle cx="390" cy="370" r="55"/>
    <rect x="120" y="360" width="280" height="50" fill="#fff"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(100,160)">
    <!-- window body -->
    <rect width="312" height="180" rx="10" fill="#1e1e1e"/>
    <!-- top bar -->
    <rect width="312" height="28" rx="10" fill="#2b2b2b"/>
    <!-- circles -->
    <circle cx="20" cy="14" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="14" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="14" r="6" fill="#27c93f"/>
    <!-- title -->
    <text x="80" y="19" font-family="monospace" font-size="16" fill="#b8e6ff">RemoteSTDIO&gt;</text>
    <!-- terminal text -->
    <text x="20" y="60" font-family="monospace" font-size="16" fill="#6fffc2">
      ls -l
      <tspan x="20" dy="22">total 4</tspan>
      <tspan x="20" dy="22">drwxr-xr-x cloud_files/</tspan>
      <tspan x="20" dy="22">-rw-r--r-- app.js</tspan>
    </text>
  </g>

  <!-- title below -->
  <text x="256" y="475" text-anchor="middle"
        font-family="sans-serif" font-weight="600"
        font-size="28" fill="#1d2a50">
    RemoteSTDIO
  </text>
</svg>
